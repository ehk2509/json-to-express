name: Publish beta

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Avoid competing tag creation and npm publish attempts; never cancel a publish.
concurrency:
  group: json-to-express-beta-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  github-release:
    # workflow_run has elevated permissions: never run PR or fork payloads.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify CI source SHA and derive immutable release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$CURRENT" != "$EXPECTED_SHA" ]]; then
            echo "Superseded push CI: skipping older main commit." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release-metadata.js check
          VERSION="$(node scripts/release-metadata.js version)"
          TAG="$(node scripts/release-metadata.js tag)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          # A previously released version always stays attached to its
          # original commit. Ordinary changes without version bump are no-ops.
          if EXISTING="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            if [[ "$EXISTING" != "commit $EXPECTED_SHA" ]]; then
              echo "$TAG is already tagged at a different SHA. Bump the version to publish again." >> "$GITHUB_STEP_SUMMARY"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
      - name: Create and verify immutable tag and GitHub release
        if: steps.metadata.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          SHA: ${{ steps.metadata.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          TAG_REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if EXISTING="$(gh api "$TAG_REF" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            test "$EXISTING" = "commit $SHA" || {
              echo "Tag SHA mismatch: refusing to overwrite $TAG" >&2
              exit 1
            }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi
          test "$(gh api "$TAG_REF" --jq '.object.type + " " + .object.sha')" = "commit $SHA"
          node scripts/release-metadata.js notes > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release already exists; leaving it unchanged."
          else
            gh release create "$TAG" --verify-tag \
              --title "json-to-express $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi
          test "$(gh api "$TAG_REF" --jq '.object.type + " " + .object.sha')" = "commit $SHA"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == true) | .tagName' | grep -Fx "$TAG"

  npm-beta:
    timeout-minutes: 20
    needs: github-release
    if: >-
      needs.github-release.result == 'success' &&
      needs.github-release.outputs.release == 'true' &&
      vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.github-release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify exact GitHub tag identity and release version
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.github-release.outputs.sha }}
          VERSION: ${{ needs.github-release.outputs.version }}
          TAG: ${{ needs.github-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/release-metadata.js check
          test "$(node scripts/release-metadata.js version)" = "$VERSION"
          test "$(node scripts/release-metadata.js tag)" = "$TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
            --jq '.object.type + " " + .object.sha')" = "commit $EXPECTED_SHA"
          npm --version | awk -F. '{ if ($1 > 11 || ($1 == 11 && $2 >= 5)) exit 0; exit 1 }'
      - name: Publish using npm OIDC and verify registry
        env:
          VERSION: ${{ needs.github-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="json-to-express"
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION already exists; never republishing."
            exit 0
          fi
          # npm exchanges the GitHub OIDC identity for short-lived credentials.
          # No NODE_AUTH_TOKEN or NPM_TOKEN is used; provenance is automatic.
          npm publish --tag beta --access public
          # npm may accept signed provenance and return success before the
          # public registry finishes processing. Poll for up to 15 minutes,
          # bypassing npm CLI metadata caching; never publish a second time.
          node scripts/npm-registry-visibility.js "$PACKAGE" "$VERSION"

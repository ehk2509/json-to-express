name: Publish beta

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  github-release:
    # workflow_run has elevated permissions: accept only successful push-to-main CI
    # from this repository, never pull requests or forks.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify public-beta release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "0.2.0-beta.1" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create immutable prerelease tag and GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists, leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "json-to-express $TAG" \
            --notes-file .github/release-notes/v0.2.0-beta.1.md \
            --prerelease

  npm-beta:
    needs: github-release
    # Enable explicitly only after the package has been bootstrapped on npm
    # and its Trusted Publisher has been configured for publish-beta.yml.
    if: >-
      needs.github-release.result == 'success' &&
      vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish the exact immutable GitHub prerelease source, rather than a
          # later main commit with the same package.json version.
          ref: v0.2.0-beta.1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify release version and OIDC-compatible npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.2.0-beta.1"
          node --version
          npm --version
          npm --version | awk -F. '{ if ($1 > 11 || ($1 == 11 && $2 >= 5)) exit 0; exit 1 }'
      - name: Publish beta with npm Trusted Publishing (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          if npm view 'json-to-express@0.2.0-beta.1' version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "npm version 0.2.0-beta.1 already published; not overwriting."
            exit 0
          fi
          # No NODE_AUTH_TOKEN or NPM_TOKEN: npm exchanges this job's
          # GitHub OIDC identity for short-lived registry credentials.
          # Provenance is automatically generated by npm for public repos.
          npm publish --tag beta --access public

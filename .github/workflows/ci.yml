      - name: Verify transaction-bound storage intents and simulated post-commit crash
        working-directory: .tmp/fastify-postgres-smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastify_native
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const db=require('./src/config/database');
          const storage=require('./src/config/storage');
          const app=require('./src/app');
          const {PrismaClient}=require('@prisma/client');
          const prisma=new PrismaClient();
          (async()=>{
            await db();
            const form=new FormData();
            form.set('title','Atomic photo');
            form.set('photo',new Blob([new Uint8Array([137,80,78,71])],{type:'image/png'}),'photo.png');
            const res=await fetch('http://127.0.0.1:3498/api/assets',{method:'POST',body:form});
            assert.equal(res.status,201);
            const item=await res.json();
            const location=path.join('uploads',item.photo.key);
            assert.ok(fs.existsSync(location));
            const pendingBefore=await prisma.j2EOutbox.count({where:{name:'__j2e_storage_cleanup__'}});
            const original=storage.enqueueCleanupIntent;
            try {
              storage.enqueueCleanupIntent=async()=>{throw new Error('inject enqueue rollback');};
              const injected=await app.inject({method:'DELETE',url:'/api/assets/'+item.id});
              assert.equal(injected.statusCode,500);
            } finally {storage.enqueueCleanupIntent=original;}
            assert.ok(await prisma.asset.findUnique({where:{id:item.id}}),'rollback preserves DB entity');
            assert.ok(fs.existsSync(location),'rollback preserves referenced file');
            assert.equal(await prisma.j2EOutbox.count({where:{name:'__j2e_storage_cleanup__'}}),pendingBefore);
            const finish=storage.finishCleanupIntent;
            try {
              storage.finishCleanupIntent=async()=>{throw new Error('simulated process crash after commit');};
              const interrupted=await app.inject({method:'DELETE',url:'/api/assets/'+item.id});
              assert.equal(interrupted.statusCode,500);
            } finally {storage.finishCleanupIntent=finish;}
            assert.equal(await prisma.asset.findUnique({where:{id:item.id}}),null);
            assert.ok(fs.existsSync(location),'persisted intent awaits background worker');
            const intent=await prisma.j2EOutbox.findFirst({where:{name:'__j2e_storage_cleanup__',status:'pending'}});
            assert.ok(intent);
            await prisma.j2EOutbox.update({where:{id:intent.id},data:{availableAt:new Date(Date.now()-1000)}});
            // Two racing deletes must not create duplicate intents or delete live references.
            const form2=new FormData();
            form2.set('title','Concurrent asset');
            form2.set('photo',new Blob([new Uint8Array([137,80,78,71])],{type:'image/png'}),'concurrent.png');
            const resp2=await fetch('http://127.0.0.1:3498/api/assets',{method:'POST',body:form2});
            assert.equal(resp2.status,201);
            const asset2=await resp2.json();
            const concurrentUrl='http://127.0.0.1:3498/api/assets/'+asset2.id;
            const races=await Promise.all([fetch(concurrentUrl,{method:'DELETE'}),fetch(concurrentUrl,{method:'DELETE'})]);
            assert.deepEqual(races.map(x=>x.status).sort((a,b)=>a-b),[204,404],'concurrent deletes should serialize and surface not-found');
            const afterConcurrent=await prisma.j2EOutbox.findMany({where:{name:'__j2e_storage_cleanup__'}});
            assert.equal(afterConcurrent.length,2,'one durable deletion intent per successfully deleted object');
            await app.close();
            await db.disconnect();
            await prisma.$disconnect();
            require('node:child_process').execFileSync(process.execPath,['src/workflows/worker.js','--once'],{env:process.env});
            const verify=new PrismaClient();
            try {
              assert.equal((await verify.j2EOutbox.findUnique({where:{id:intent.id}})).status,'done');
              assert.equal(fs.existsSync(location),false);
            } finally {await verify.$disconnect();}
          })().catch(error=>{console.error(error);process.exitCode=1;}).finally(()=>prisma.$disconnect());
          NODE
      - name: Verify PostgreSQL transactional rollback on dependent changes
        working-directory: .tmp/fastify-postgres-smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastify_native
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {PrismaClient} = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const owner = await prisma.user.create({data:{name:'Rollback owner'}});
            const note = await prisma.note.create({data:{title:'Rollback note', owner:{connect:{id:owner.id}}}});
            try {
              await assert.rejects(
                prisma.$transaction(async tx => {
                  await tx.note.update({where:{id:note.id},data:{owner:{disconnect:true}}});
                  await tx.user.update({where:{id:owner.id},data:{deletedAt:new Date()}});
                  throw new Error('injected rollback');
                }, {isolationLevel:'Serializable'}),
                /injected rollback/
              );
              const [unchangedOwner, unchangedNote] = await Promise.all([
                prisma.user.findUnique({where:{id:owner.id}}),
                prisma.note.findUnique({where:{id:note.id}})
              ]);
              assert.equal(unchangedOwner.deletedAt, null, 'parent tombstone must roll back');
              assert.equal(unchangedNote.ownerId, owner.id, 'relation nullification must roll back');
            } finally {
              await prisma.note.delete({where:{id:note.id}});
              await prisma.user.delete({where:{id:owner.id}});
            }
          })().catch(error => {console.error(error);process.exitCode=1;}).finally(() => prisma.$disconnect());
          NODE
      - name: Verify Fastify HTTP delete rolls back dependent mutations
        working-directory: .tmp/fastify-postgres-smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastify_native
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {PrismaClient} = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const owner = await prisma.user.create({data:{name:'HTTP rollback owner'}});
            const note = await prisma.note.create({data:{title:'HTTP rollback note', owner:{connect:{id:owner.id}}}});
            try {
              await prisma.$executeRawUnsafe("CREATE FUNCTION j2e_force_delete_failure() RETURNS trigger LANGUAGE plpgsql AS 'BEGIN RAISE EXCEPTION ''injected HTTP delete failure''; END;'");
              await prisma.$executeRawUnsafe('CREATE TRIGGER j2e_force_delete_failure BEFORE UPDATE ON "User" FOR EACH ROW WHEN (NEW."deletedAt" IS NOT NULL) EXECUTE FUNCTION j2e_force_delete_failure()');
              const response = await fetch('http://127.0.0.1:3498/api/users/'+owner.id,{method:'DELETE'});
              assert.equal(response.status,500,'injected database error must fail the HTTP operation');
              const unchangedOwner = await prisma.user.findUnique({where:{id:owner.id}});
              const unchangedNote = await prisma.note.findUnique({where:{id:note.id}});
              assert.equal(unchangedOwner.deletedAt,null,'parent soft delete rolled back');
              assert.equal(unchangedNote.ownerId,owner.id,'dependent nullification rolled back');
            } finally {
              await prisma.$executeRawUnsafe('DROP TRIGGER IF EXISTS j2e_force_delete_failure ON "User"');
              await prisma.$executeRawUnsafe('DROP FUNCTION IF EXISTS j2e_force_delete_failure()');
              await prisma.note.deleteMany({where:{id:note.id}});
              await prisma.user.deleteMany({where:{id:owner.id}});
              await prisma.$disconnect();
            }
          })().catch(error => {console.error(error);process.exitCode=1;});
          NODE
      - name: SIGKILL Prisma transaction before and after commit; restart cleanup worker
        working-directory: .tmp/fastify-postgres-smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastify_native

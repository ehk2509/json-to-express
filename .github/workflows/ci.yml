name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - run: npm run validate:examples

  generated-app-e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate application
        run: node bin/json-to-express.js generate examples/e2e.json
      - name: Validate generated Compose stack
        working-directory: .tmp/e2e-app
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build generated Docker image
        working-directory: .tmp/e2e-app
        run: docker build -t j2e-mongo-e2e:ci .
      - name: Install generated application
        working-directory: .tmp/e2e-app
        run: npm install --no-audit --no-fund
      - name: Test generated application contracts
        working-directory: .tmp/e2e-app
        run: npm test
      - name: Start generated application
        working-directory: .tmp/e2e-app
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_e2e
          PORT: 3456
          HOST: 127.0.0.1
          TEST_WEBHOOK_URL: http://127.0.0.1:4567/hook
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
      - name: Exercise generated CRUD API
        run: node scripts/e2e-generated-app.js
      - name: Print generated server log on failure
        if: failure()
        run: cat .tmp/e2e-app/server.log || true


  generated-app-postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: j2e_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d j2e_postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate PostgreSQL application
        run: node bin/json-to-express.js generate examples/e2e-postgres.json
      - name: Validate generated PostgreSQL Compose stack
        working-directory: .tmp/e2e-postgres
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build generated PostgreSQL Docker image
        working-directory: .tmp/e2e-postgres
        run: docker build -t j2e-postgres-e2e:ci .
      - name: Install generated application
        working-directory: .tmp/e2e-postgres
        run: npm install --no-audit --no-fund
      - name: Push Prisma schema
        working-directory: .tmp/e2e-postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/j2e_postgres
        run: npm run db:push
      - name: Test generated PostgreSQL contracts
        working-directory: .tmp/e2e-postgres
        run: npm test
      - name: Start generated PostgreSQL application
        working-directory: .tmp/e2e-postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/j2e_postgres
          PORT: 3457
          HOST: 127.0.0.1
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
      - name: Exercise generated PostgreSQL API
        run: node scripts/e2e-generated-postgres.js
      - name: Print PostgreSQL generated server log on failure
        if: failure()
        run: cat .tmp/e2e-postgres/server.log || true

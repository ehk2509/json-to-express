          NODE
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const audit=require('./scripts/storage-reconcile');
          (async()=>{
            const listed=await audit.inventory(['assets/files/'],new Date(Date.now()+60000),1000);
            assert.ok(listed.items.some(item=>item.key==='assets/files/recover-after-outage.txt'),

            const labelResponse=await post('http://127.0.0.1:3498/api/labels',{title:'Shared label',owners:[owner.id]});
            assert.equal(labelResponse.status,201);
            const label=await labelResponse.json();
            assert.equal((await fetch(users+'/'+owner.id,{method:'DELETE'})).status,204);
            assert.equal((await fetch(users+'/'+owner.id)).status,404);
            const noteAfter = await fetch(notes+'/'+note.id);
            assert.equal(noteAfter.status,200);
            assert.equal((await noteAfter.json()).ownerId,null);
            assert.equal((await fetch(logs+'/'+log.id)).status,404);
            const {PrismaClient} = require('@prisma/client');
            const prisma = new PrismaClient();
            try {
              assert.ok((await prisma.user.findUnique({where:{id:owner.id}})).deletedAt);
              assert.ok((await prisma.log.findUnique({where:{id:log.id}})).deletedAt);
              assert.ok((await prisma.project.findUnique({where:{id:project.id}})).deletedAt, 'multilevel cascade must soft-delete project');
              assert.equal(await prisma.projectEntry.findUnique({where:{id:descendant.id}}),null,'multilevel cascade must physically delete child');
              assert.deepEqual((await prisma.label.findUnique({where:{id:label.id},include:{owners:true}})).owners,[],'many-to-many nullify must detach join row');
            } finally {await prisma.$disconnect();}
          })().catch(error => {console.error(error); process.exitCode = 1;});

            assert.equal(registration.status, 201);
            const registrationBody = await registration.json();
            assert.ok(registrationBody.accessToken);
            const login = await fetch('http://127.0.0.1:3497/auth/login', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'native@example.com',password:'securePass123'})});
            assert.equal(login.status, 200);
            assert.ok((await login.json()).accessToken);
            assert.ok(registrationBody.refreshToken);
            const refresh = await fetch('http://127.0.0.1:3497/auth/refresh', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({refreshToken:registrationBody.refreshToken})});
            assert.equal(refresh.status, 200);
            assert.ok((await refresh.json()).accessToken);
            const logout = await fetch('http://127.0.0.1:3497/auth/logout', {method:'POST'});
            assert.equal(logout.status, 204);
            const invalidLogin = await fetch('http://127.0.0.1:3497/auth/login', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'native@example.com',password:'wrong'})});
            assert.equal(invalidLogin.status, 401);
            const forgot = await fetch('http://127.0.0.1:3497/auth/forgot-password', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'native@example.com'})});
            assert.equal(forgot.status, 202);
            const resetToken = (await forgot.json()).resetToken;
            assert.ok(resetToken);
            const reset = await fetch('http://127.0.0.1:3497/auth/reset-password', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:resetToken,password:'anotherSecure123'})});
            assert.equal(reset.status, 200);

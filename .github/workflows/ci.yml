          done
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const url = 'http://127.0.0.1:3497/api/todos';
          const submit = key => fetch(url, {method: 'POST', headers: {'content-type': 'application/json', ...(key ? {'x-api-key': key} : {})}, body: JSON.stringify({title: 'RBAC test'})});
          (async () => {
            assert.equal((await submit()).status, 401);
            assert.equal((await submit('test-viewer-key')).status, 403);
            const created = await submit('test-admin-key');
            assert.equal(created.status, 201);
            const item = await created.json();

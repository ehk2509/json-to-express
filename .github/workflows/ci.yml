            const reused = await fetch('http://127.0.0.1:3497/auth/reset-password', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:resetToken,password:'anotherSecure123'})});
            assert.equal(reused.status, 400);

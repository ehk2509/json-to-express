name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check
      - run: npm run validate:examples

  generated-app-e2e:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      E2E_API_KEY: ci-api-key
      E2E_VIEWER_API_KEY: ci-viewer-key
      OIDC_CLIENT_ID: j2e-e2e-client
      REDIS_URL: redis://127.0.0.1:6379
      FILE_SIGNING_SECRET: ci-file-signing-secret-at-least-32-chars
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate application
        run: node bin/json-to-express.js generate examples/e2e.json
      - name: Validate generated Compose stack
        working-directory: .tmp/e2e-app
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build generated Docker image
        working-directory: .tmp/e2e-app
        run: docker build -t j2e-mongo-e2e:ci .
      - name: Smoke generated Mongo Compose stack
        working-directory: .tmp/e2e-app
        env:
          TEST_WEBHOOK_URL: http://example.invalid/hook
        run: |
          docker compose up -d --build
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3456/health > /dev/null; then break; fi
            sleep 2
          done
          if ! curl --fail http://127.0.0.1:3456/health; then
            docker compose logs --no-color
            docker compose down -v
            exit 1
          fi
          docker compose down -v
      - name: Install generated application
        working-directory: .tmp/e2e-app
        run: npm install --no-audit --no-fund
      - name: Test generated application contracts
        working-directory: .tmp/e2e-app
        run: npm test
      - name: Install and compile generated SDK
        working-directory: .tmp/e2e-app/sdk
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Build generated admin UI
        working-directory: .tmp/e2e-app/admin
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Start generated admin preview
        working-directory: .tmp/e2e-app/admin
        run: |
          npm run preview > admin.log 2>&1 &
          echo $! > admin.pid
      - name: Smoke generated admin UI
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/admin.html; then break; fi
            sleep 1
          done
          grep -q 'id="root"' /tmp/admin.html
      - name: Start generated application
        working-directory: .tmp/e2e-app
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_e2e
          PORT: 3456
          HOST: 127.0.0.1
          TEST_WEBHOOK_URL: http://127.0.0.1:4567/hook
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
      - name: Exercise generated JavaScript SDK
        run: node scripts/e2e-generated-sdk.js .tmp/e2e-app http://127.0.0.1:3456 _id
      - name: Exercise generated admin runtime
        run: node scripts/e2e-generated-admin.js .tmp/e2e-app http://127.0.0.1:3456 _id
      - name: Exercise generated CRUD API
        run: node scripts/e2e-generated-app.js
      - name: Print generated server log on failure
        if: failure()
        run: cat .tmp/e2e-app/server.log || true


  generated-app-postgres-e2e:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      E2E_API_KEY: ci-api-key
      E2E_VIEWER_API_KEY: ci-viewer-key
      OIDC_CLIENT_ID: j2e-e2e-client
      REDIS_URL: redis://127.0.0.1:6379
      FILE_SIGNING_SECRET: ci-file-signing-secret-at-least-32-chars
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: j2e_postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d j2e_postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate PostgreSQL application
        run: node bin/json-to-express.js generate examples/e2e-postgres.json
      - name: Validate generated PostgreSQL Compose stack
        working-directory: .tmp/e2e-postgres
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build generated PostgreSQL Docker image
        working-directory: .tmp/e2e-postgres
        run: docker build -t j2e-postgres-e2e:ci .
      - name: Smoke generated PostgreSQL Compose stack
        working-directory: .tmp/e2e-postgres
        run: |
          docker compose up -d --build
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3457/health > /dev/null; then break; fi
            sleep 2
          done
          if ! curl --fail http://127.0.0.1:3457/health; then
            docker compose logs --no-color
            docker compose down -v
            exit 1
          fi
          docker compose down -v
      - name: Install generated application
        working-directory: .tmp/e2e-postgres
        run: npm install --no-audit --no-fund
      - name: Generate and deploy initial Prisma migration
        working-directory: .tmp/e2e-postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/j2e_postgres
        run: |
          npm run db:migrate:init
          test -s prisma/migrations/00000000000000_init/migration.sql
          grep -q 'provider = "postgresql"' prisma/migrations/migration_lock.toml
          if npm run db:migrate:init; then echo "Initial migration overwrote history"; exit 1; fi
          npm run db:migrate:deploy
          npm run db:migrate:deploy
          npm run db:migrate:status
      - name: Test generated PostgreSQL contracts
        working-directory: .tmp/e2e-postgres
        run: npm test
      - name: Install and compile generated PostgreSQL SDK
        working-directory: .tmp/e2e-postgres/sdk
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Build generated PostgreSQL admin UI
        working-directory: .tmp/e2e-postgres/admin
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Start generated PostgreSQL admin preview
        working-directory: .tmp/e2e-postgres/admin
        run: |
          npm run preview > admin.log 2>&1 &
          echo $! > admin.pid
      - name: Smoke generated PostgreSQL admin UI
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/admin-postgres.html; then break; fi
            sleep 1
          done
          grep -q 'id="root"' /tmp/admin-postgres.html
      - name: Start generated PostgreSQL application
        working-directory: .tmp/e2e-postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/j2e_postgres
          PORT: 3457
          HOST: 127.0.0.1
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
      - name: Exercise generated PostgreSQL SDK
        run: node scripts/e2e-generated-sdk.js .tmp/e2e-postgres http://127.0.0.1:3457 id
      - name: Exercise generated PostgreSQL admin runtime
        run: node scripts/e2e-generated-admin.js .tmp/e2e-postgres http://127.0.0.1:3457 id
      - name: Exercise generated PostgreSQL API
        run: node scripts/e2e-generated-postgres.js
      - name: Verify idempotent relational Prisma fixtures
        working-directory: .tmp/e2e-postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/j2e_postgres
        run: |
          npm run db:seed
          npm run db:seed
          node - <<'NODE'
          const {PrismaClient} = require('@prisma/client');
          const assert = require('node:assert/strict');
          const prisma = new PrismaClient();
          (async () => {
            const categories = await prisma.category.findMany({where: {name: 'Fixture Category'}});
            const products = await prisma.product.findMany({where: {fixtureKey: 'fixture-prod-1'}, include: {category: true}});
            assert.equal(categories.length, 1);
            assert.equal(products.length, 1);
            assert.equal(products[0].category.name, 'Fixture Category');
          })().catch(error => {console.error(error); process.exitCode = 1;}).finally(() => prisma.$disconnect());
          NODE
      - name: Print PostgreSQL generated server log on failure
        if: failure()
        run: cat .tmp/e2e-postgres/server.log || true

  generated-app-s3-e2e:
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: j2e-e2e
      AWS_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:9090
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start S3-compatible S3Mock
        run: |
          docker run -d --name j2e-s3mock \
            -p 9090:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=j2e-e2e \
            adobe/s3mock:5.2.2
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9090/favicon.ico > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9090/favicon.ico
      - name: Generate S3 application
        run: node bin/json-to-express.js generate examples/e2e-s3.json
      - name: Install generated S3 application
        working-directory: .tmp/e2e-s3
        run: npm install --no-audit --no-fund
      - name: Test generated S3 contracts
        working-directory: .tmp/e2e-s3
        run: npm test
      - name: Start generated S3 application
        working-directory: .tmp/e2e-s3
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_s3
          PORT: 3458
          HOST: 127.0.0.1
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
      - name: Exercise generated S3 storage
        run: node scripts/e2e-generated-s3.js
      - name: Print generated S3 logs on failure
        if: failure()
        run: |
          cat .tmp/e2e-s3/server.log || true
          docker logs j2e-s3mock || true

  generated-fastify-e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Fastify application
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const input = {specVersion: '1.0', app: {name: 'fastify-crud-smoke'}, database: {type: 'mongodb'}, cache: {enabled: true, provider: 'memory'}, entities: {Todo: {fields: {title: {type: 'string', required: true}}, operations: {list: {cache: {enabled:true, ttlSeconds:120}}, get: {cache: {enabled:true, ttlSeconds:120}}}}}};
          input.app.framework = 'fastify';
          input.app.port = 3499;
          input.app.health = {enabled: true, path: '/health', response: {status: 'ok'}};
          input.generation = {outputDir: '.tmp/fastify-smoke'};
          fs.writeFileSync('/tmp/fastify-spec.json', JSON.stringify(input));
          NODE
          node bin/json-to-express.js generate /tmp/fastify-spec.json
      - name: Install generated Fastify app
        working-directory: .tmp/fastify-smoke
        run: npm install --no-audit --no-fund
      - name: Start generated Fastify app and check native health route
        working-directory: .tmp/fastify-smoke
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify
          PORT: 3499
          HOST: 127.0.0.1
        run: |
          npm start > fastify.log 2>&1 &
          echo $! > fastify.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3499/health >/tmp/fastify-health.json; then break; fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/fastify-health.json || { cat fastify.log; exit 1; }
          curl -fsSi http://127.0.0.1:3499/health | grep -qi 'x-content-type-options: nosniff'
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const base = 'http://127.0.0.1:3499/api/todos';
          (async () => {
            const create = await fetch(base, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({title:'Native Fastify'})});
            assert.equal(create.status, 201);
            const item = await create.json();
            assert.ok(item._id);
            const get = await fetch(base + '/' + item._id);
            assert.equal(get.status, 200);
            assert.equal(get.headers.get('x-cache'), 'MISS');
            assert.equal((await get.json()).title, 'Native Fastify');
            const cached = await fetch(base + '/' + item._id);
            assert.equal(cached.headers.get('x-cache'), 'HIT');
            const list = await fetch(base);
            assert.equal(list.status, 200);
            assert.ok((await list.json()).some(row => row.title === 'Native Fastify'));
            const update = await fetch(base + '/' + item._id, {method:'PATCH', headers:{'content-type':'application/json'}, body:JSON.stringify({title:'Updated Native'})});
            assert.equal(update.status, 200);
            assert.equal((await update.json()).title, 'Updated Native');
            const afterUpdate = await fetch(base + '/' + item._id);
            assert.equal(afterUpdate.headers.get('x-cache'), 'MISS');
            assert.equal((await afterUpdate.json()).title, 'Updated Native');
            const invalid = await fetch(base + '/invalid-id');
            assert.equal(invalid.status, 400);
            const remove = await fetch(base + '/' + item._id, {method:'DELETE'});
            assert.equal(remove.status, 204);
            const missing = await fetch(base + '/' + item._id);
            assert.equal(missing.status, 404);
          })().catch(error => {console.error(error); process.exitCode = 1;});
          NODE
          kill $(cat fastify.pid)

  generated-fastify-direct-e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate adapter-free Fastify app
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('/tmp/fastify-direct-spec.json', JSON.stringify({
            specVersion:'1.0',
            generation:{outputDir:'.tmp/fastify-direct-smoke'},
            app:{name:'fastify-direct-smoke', framework:'fastify', host:'127.0.0.1', port:3499},
            database:{type:'mongodb'},
            cache:{enabled:true,provider:'redis',redis:{urlEnv:'REDIS_URL'}},
            auth:{enabled:true,strategies:['apiKey'],apiKey:{keys:[{env:'TEST_API_KEY',userId:'reader',roles:['reader']}]}},
            entities:{Todo:{fields:{title:{type:'string',required:true},done:{type:'boolean',default:false}},operations:{get:{auth:{required:true,strategies:['apiKey']},cache:{enabled:true,ttlSeconds:30}}}}}
          }));
          NODE
          node bin/json-to-express.js generate /tmp/fastify-direct-spec.json
      - name: Verify no Express runtime dependency
        working-directory: .tmp/fastify-direct-smoke
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pkg = require('./package.json');
          assert.ok(pkg.dependencies.fastify);
          assert.equal(pkg.dependencies.express,undefined);
          assert.equal(pkg.dependencies['@fastify/express'],undefined);
          assert.ok(pkg.dependencies.redis);
          assert.doesNotMatch(fs.readFileSync('src/server.js','utf8'), /fastifyExpress|fastify\.use\(/);
          assert.doesNotMatch(fs.readFileSync('src/app.js','utf8'), /require\(['"]express['"]\)/);
          NODE
      - name: Install and test adapter-free app
        working-directory: .tmp/fastify-direct-smoke
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Exercise adapter-free Fastify server
        working-directory: .tmp/fastify-direct-smoke
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify_direct
          PORT: 3499
          HOST: 127.0.0.1
          TEST_API_KEY: ci-native-key
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          npm start > server.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3499/health >/dev/null; then break; fi
            sleep 1
          done
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const base = 'http://127.0.0.1:3499/api/todos';
          (async () => {
            const headers = {'content-type':'application/json','x-api-key':'ci-native-key'};
            const invalid = await fetch(base,{method:'POST',headers,body:JSON.stringify({})});
            assert.equal(invalid.status,400);
            const response = await fetch(base,{method:'POST',headers,body:JSON.stringify({title:'native direct'})});
            assert.equal(response.status,201);
            const record = await response.json();
            assert.ok(record._id);
            assert.equal((await fetch(base+'/'+record._id)).status,401);
            const authorized = {'x-api-key':'ci-native-key'};
            const fetched = await fetch(base+'/'+record._id,{headers:authorized});
            assert.equal(fetched.status,200);
            const cached = await fetch(base+'/'+record._id,{headers:authorized});
            assert.equal(cached.status,200);
            assert.equal(cached.headers.get('x-cache'),'HIT');
            const update = await fetch(base+'/'+record._id,{method:'PATCH',headers,body:JSON.stringify({done:true})});
            assert.equal(update.status,200);
            assert.equal((await update.json()).done,true);
            assert.equal((await fetch(base+'/'+record._id,{method:'DELETE',headers:authorized})).status,204);
            assert.equal((await fetch(base+'/'+record._id,{headers:authorized})).status,404);
          })().catch(error => {console.error(error); process.exitCode=1;});
          NODE
      - name: Print adapter-free Fastify logs
        if: failure()
        run: cat .tmp/fastify-direct-smoke/server.log || true

  generated-fastify-postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastify_native
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastify_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate native Fastify PostgreSQL app
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const input = {
            specVersion: '1.0',
            generation: {outputDir: '.tmp/fastify-postgres-smoke'},
            app: {name: 'fastify-postgres-smoke', framework: 'fastify', port: 3498, host: '127.0.0.1'},
            database: {type: 'postgresql', uriEnv: 'DATABASE_URL'},
            entities: {Todo: {fields: {title: {type: 'string', required: true}, done: {type: 'boolean', default: false}}}, User: {fields: {name: {type: 'string', required: true}}, softDelete: {enabled: true}, hooks:{module:'src/hooks/user.js', before:{create:'preCreate'}, after:{create:'postCreate'}}}, Task: {fields: {title: {type: 'string', required: true}, owner: {type: 'reference', ref: 'User', onDelete: 'restrict'}}, operations: {delete: false}}, Note: {fields: {title: {type: 'string', required: true}, owner: {type: 'reference', ref: 'User', onDelete: 'nullify'}}}, Log: {fields: {title: {type: 'string', required: true}, owner: {type: 'reference', ref: 'User', onDelete: 'cascade'}}, softDelete: {enabled: true}}}
          };
          fs.writeFileSync('/tmp/fastify-postgres-spec.json', JSON.stringify(input));
          NODE
          node bin/json-to-express.js generate /tmp/fastify-postgres-spec.json
          mkdir -p .tmp/fastify-postgres-smoke/src/hooks
          cat > .tmp/fastify-postgres-smoke/src/hooks/user.js <<'HOOK'
          module.exports = {
            preCreate({req}) {req.body.name = 'native-' + req.body.name;},
            postCreate({result}) {if (!result.name.startsWith('native-')) throw new Error('Postgres hook not executed');}
          };
          HOOK
      - name: Install generated PostgreSQL app
        working-directory: .tmp/fastify-postgres-smoke
        run: npm install --no-audit --no-fund
      - name: Deploy Prisma migration
        working-directory: .tmp/fastify-postgres-smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastify_native
        run: |
          npm run db:migrate:init
          npm run db:migrate:deploy
          npm run prisma:generate
      - name: Exercise native Fastify PostgreSQL CRUD
        working-directory: .tmp/fastify-postgres-smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastify_native
          PORT: 3498
          HOST: 127.0.0.1
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3498/health > /dev/null; then break; fi
            sleep 1
          done
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const url = 'http://127.0.0.1:3498/api/todos';
          (async () => {
            const invalidBody = await fetch(url, {method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({done:'not a boolean'})});
            assert.equal(invalidBody.status, 400);
            const create = await fetch(url, {method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({title:'PostgreSQL native', done:false})});
            assert.equal(create.status, 201);
            const item = await create.json();
            assert.ok(item.id);
            const get = await fetch(url + '/' + item.id);
            assert.equal(get.status, 200);
            const list = await fetch(url + '?title=PostgreSQL%20native');
            assert.equal(list.status, 200);
            assert.ok((await list.json()).some(row => row.id === item.id));
            const update = await fetch(url + '/' + item.id, {method:'PATCH', headers:{'content-type':'application/json'}, body:JSON.stringify({done:true})});
            assert.equal(update.status, 200);
            assert.equal((await update.json()).done, true);
            assert.equal((await fetch(url + '/bad-id')).status, 400);
            assert.equal((await fetch(url + '/' + item.id, {method:'DELETE'})).status, 204);
            assert.equal((await fetch(url + '/' + item.id)).status, 404);
            const users = 'http://127.0.0.1:3498/api/users';
            const tasks = 'http://127.0.0.1:3498/api/tasks';
            const ownerResponse = await fetch(users,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:'Owner'})});
            assert.equal(ownerResponse.status,201);
            const owner = await ownerResponse.json();
            assert.equal(owner.name, 'native-Owner');
            const newTask = await fetch(tasks,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:'Related',owner:owner.id})});
            assert.equal(newTask.status,201);
            const task = await newTask.json();
            assert.ok(task.id);
            const restricted = await fetch(users+'/'+owner.id,{method:'DELETE'});
            assert.equal(restricted.status,409);
            const moved = await fetch(tasks+'/'+task.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({owner:null})});
            assert.equal(moved.status,200);
            assert.equal((await moved.json()).ownerId,null);
            const notes = 'http://127.0.0.1:3498/api/notes';
            const logs = 'http://127.0.0.1:3498/api/logs';
            const makeChild = (url, title) => fetch(url, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title,owner:owner.id})});
            const noteResponse = await makeChild(notes, 'Nullified');
            const logResponse = await makeChild(logs, 'Cascaded');
            assert.equal(noteResponse.status,201);
            assert.equal(logResponse.status,201);
            const note = await noteResponse.json();
            const log = await logResponse.json();
            assert.equal((await fetch(users+'/'+owner.id,{method:'DELETE'})).status,204);
            assert.equal((await fetch(users+'/'+owner.id)).status,404);
            const noteAfter = await fetch(notes+'/'+note.id);
            assert.equal(noteAfter.status,200);
            assert.equal((await noteAfter.json()).ownerId,null);
            assert.equal((await fetch(logs+'/'+log.id)).status,404);
            const {PrismaClient} = require('@prisma/client');
            const prisma = new PrismaClient();
            try {
              assert.ok((await prisma.user.findUnique({where:{id:owner.id}})).deletedAt);
              assert.ok((await prisma.log.findUnique({where:{id:log.id}})).deletedAt);
            } finally {await prisma.$disconnect();}
          })().catch(error => {console.error(error); process.exitCode = 1;});
          NODE
      - name: Verify PostgreSQL transactional rollback on dependent changes
        working-directory: .tmp/fastify-postgres-smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastify_native
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {PrismaClient} = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const owner = await prisma.user.create({data:{name:'Rollback owner'}});
            const note = await prisma.note.create({data:{title:'Rollback note', owner:{connect:{id:owner.id}}}});
            try {
              await assert.rejects(
                prisma.$transaction(async tx => {
                  await tx.note.update({where:{id:note.id},data:{owner:{disconnect:true}}});
                  await tx.user.update({where:{id:owner.id},data:{deletedAt:new Date()}});
                  throw new Error('injected rollback');
                }, {isolationLevel:'Serializable'}),
                /injected rollback/
              );
              const [unchangedOwner, unchangedNote] = await Promise.all([
                prisma.user.findUnique({where:{id:owner.id}}),
                prisma.note.findUnique({where:{id:note.id}})
              ]);
              assert.equal(unchangedOwner.deletedAt, null, 'parent tombstone must roll back');
              assert.equal(unchangedNote.ownerId, owner.id, 'relation nullification must roll back');
            } finally {
              await prisma.note.delete({where:{id:note.id}});
              await prisma.user.delete({where:{id:owner.id}});
            }
          })().catch(error => {console.error(error);process.exitCode=1;}).finally(() => prisma.$disconnect());
          NODE
      - name: Verify Fastify HTTP delete rolls back dependent mutations
        working-directory: .tmp/fastify-postgres-smoke
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastify_native
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {PrismaClient} = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const owner = await prisma.user.create({data:{name:'HTTP rollback owner'}});
            const note = await prisma.note.create({data:{title:'HTTP rollback note', owner:{connect:{id:owner.id}}}});
            try {
              await prisma.$executeRawUnsafe("CREATE FUNCTION j2e_force_delete_failure() RETURNS trigger LANGUAGE plpgsql AS 'BEGIN RAISE EXCEPTION ''injected HTTP delete failure''; END;'");
              await prisma.$executeRawUnsafe('CREATE TRIGGER j2e_force_delete_failure BEFORE UPDATE ON "User" FOR EACH ROW WHEN (NEW."deletedAt" IS NOT NULL) EXECUTE FUNCTION j2e_force_delete_failure()');
              const response = await fetch('http://127.0.0.1:3498/api/users/'+owner.id,{method:'DELETE'});
              assert.equal(response.status,500,'injected database error must fail the HTTP operation');
              const unchangedOwner = await prisma.user.findUnique({where:{id:owner.id}});
              const unchangedNote = await prisma.note.findUnique({where:{id:note.id}});
              assert.equal(unchangedOwner.deletedAt,null,'parent soft delete rolled back');
              assert.equal(unchangedNote.ownerId,owner.id,'dependent nullification rolled back');
            } finally {
              await prisma.$executeRawUnsafe('DROP TRIGGER IF EXISTS j2e_force_delete_failure ON "User"');
              await prisma.$executeRawUnsafe('DROP FUNCTION IF EXISTS j2e_force_delete_failure()');
              await prisma.note.deleteMany({where:{id:note.id}});
              await prisma.user.deleteMany({where:{id:owner.id}});
              await prisma.$disconnect();
            }
          })().catch(error => {console.error(error);process.exitCode=1;});
          NODE
      - name: Print Fastify PostgreSQL logs on failure
        if: failure()
        run: cat .tmp/fastify-postgres-smoke/server.log || true


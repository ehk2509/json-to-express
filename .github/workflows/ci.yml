          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          S3_ENDPOINT=http://127.0.0.1:9091 node - <<'NODE'
          const assert=require('node:assert/strict');
          const db=require('./src/config/database');
          const storage=require('./src/config/storage');
          const outbox=require('./src/workflows/outbox');
          (async()=>{
            await db();
            try {
              const success=await storage.cleanupAfterCommit([{key:'assets/files/recover-after-outage.txt',provider:'s3'}]);
              assert.equal(success,false,'S3 service unavailable through broken endpoint');
              assert.equal((await outbox.storageStats()).pending,1,'cleanup intent persisted in MongoDB');
            } finally {await db.disconnect();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          sleep 2
          node src/workflows/worker.js --once
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const db=require('./src/config/database');
          const outbox=require('./src/workflows/outbox');
          const {S3Client,HeadObjectCommand}=require('@aws-sdk/client-s3');
          (async()=>{
            await db();
            try {
              assert.equal((await outbox.storageStats()).pending,0);
              const client=new S3Client({region:'us-east-1',endpoint:process.env.S3_ENDPOINT,forcePathStyle:true,credentials:{accessKeyId:'test',secretAccessKey:'test'}});
              try {
                await assert.rejects(client.send(new HeadObjectCommand({Bucket:'j2e-e2e',Key:'assets/files/recover-after-outage.txt'})),error=>error.$metadata && error.$metadata.httpStatusCode===404);
              } finally {client.destroy();}
            } finally {await db.disconnect();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Repeat S3 outages across worker restarts and verify idempotent recovery
        working-directory: .tmp/fastify-s3
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify_s3
          S3_BUCKET: j2e-e2e
          AWS_REGION: us-east-1
          S3_ENDPOINT: http://127.0.0.1:9090
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {execFileSync}=require('node:child_process');
          const db=require('./src/config/database');
          const outbox=require('./src/workflows/outbox');
          const {S3Client,PutObjectCommand,HeadObjectCommand}=require('@aws-sdk/client-s3');
          const key='assets/files/retry-three-outages.txt';
          const client=new S3Client({region:'us-east-1',endpoint:process.env.S3_ENDPOINT,
            forcePathStyle:true,credentials:{accessKeyId:'test',secretAccessKey:'test'}});
          const worker=endpoint=>execFileSync(process.execPath,['src/workflows/worker.js','--once'],{
            env:{...process.env,S3_ENDPOINT:endpoint,J2E_WORKER_QUEUES:'storage'},timeout:45000
          });
          (async()=>{
            await client.send(new PutObjectCommand({Bucket:'j2e-e2e',Key:key,Body:'recoverable'}));
            await db();
            try {
              const job=await outbox.enqueueJob('__j2e_storage_cleanup__',{values:[{key,provider:'s3'}]},{
                config:{queue:'storage',maxAttempts:6,backoffMs:50}
              });
              for(let attempt=1;attempt<=3;attempt++){
                await outbox.Outbox.updateOne({_id:job._id},{$set:{availableAt:new Date(Date.now()-1000)}});
                worker('http://127.0.0.1:9091');
                const failed=await outbox.Outbox.findById(job._id);
                assert.equal(failed.status,'pending','transient S3 outage must retain job');
                assert.equal(failed.attempts,attempt,'attempt count persists across processes');
              }
              await outbox.Outbox.updateOne({_id:job._id},{$set:{availableAt:new Date(Date.now()-1000)}});
              worker(process.env.S3_ENDPOINT);
              assert.equal((await outbox.Outbox.findById(job._id)).status,'done');
              await assert.rejects(client.send(new HeadObjectCommand({Bucket:'j2e-e2e',Key:key})),
                e=>e.$metadata && e.$metadata.httpStatusCode===404);
              const second=await outbox.enqueueJob('__j2e_storage_cleanup__',{values:[{key,provider:'s3'}]},{
                config:{queue:'storage',maxAttempts:3,backoffMs:10}
              });
              worker(process.env.S3_ENDPOINT);
              assert.equal((await outbox.Outbox.findById(second._id)).status,'done','repeated deletion is idempotent');
            } finally {await db.disconnect();client.destroy();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: SIGKILL S3 cleanup worker between deletion and acknowledgement
        working-directory: .tmp/fastify-s3
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify_s3
          S3_BUCKET: j2e-e2e
          AWS_REGION: us-east-1
          S3_ENDPOINT: http://127.0.0.1:9090
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
        run: |
          cp ../../scripts/fixtures/storage-worker-kill.js ./storage-worker-kill.js
          node storage-worker-kill.js s3
      - name: Print generated S3 logs on failure
        if: failure()
        run: |
          cat .tmp/fastify-s3/server.log || true
          docker logs j2e-s3mock || true

  generated-fastify-local-files-e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate native Fastify local signed file application
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync('examples/e2e-s3.json','utf8'));
          input.app.framework = 'fastify';
          input.app.port = 3494;
          input.storage.provider = 'local';
          input.outbox = {worker: 'separate'};
          input.storage.local = {directory: 'uploaded-files'};
          input.generation.outputDir = '.tmp/fastify-local-files';
          fs.writeFileSync('/tmp/fastify-local-files.json',JSON.stringify(input));
          NODE
          node bin/json-to-express.js generate /tmp/fastify-local-files.json
      - name: Install generated native Fastify local storage app
        working-directory: .tmp/fastify-local-files
        run: npm install --no-audit --no-fund
      - name: Verify signed download and invalid token rejection
        working-directory: .tmp/fastify-local-files
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify_local
          FILE_SIGNING_SECRET: test-only-local-file-signing-secret
          PORT: 3494
          HOST: 127.0.0.1
        run: |
          npm start > server.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3494/health >/dev/null; then break; fi
            sleep 1
          done
          node - <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const form = new FormData();
            form.set('name','Local signed asset');
            form.set('file', new Blob(['local-content'],{type:'text/plain'}),'sample.txt');
            const result = await fetch('http://127.0.0.1:3494/api/assets',{method:'POST',body:form});
            assert.equal(result.status,201);
            const asset = await result.json();
            assert.ok(asset.file.url);
            const downloaded = await fetch(asset.file.url);
            assert.equal(downloaded.status,200);
            assert.equal(await downloaded.text(),'local-content');
            const invalid = await fetch('http://127.0.0.1:3494/files/invalid.token');
            assert.equal(invalid.status,403);
            const removed = await fetch('http://127.0.0.1:3494/api/assets/'+asset._id,{method:'DELETE'});
            assert.equal(removed.status,204);
            const missing = await fetch(asset.file.url);
            assert.equal(missing.status,404);
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Verify durable Mongo cleanup retry and safe orphan reconciliation
        working-directory: .tmp/fastify-local-files
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify_local
          FILE_SIGNING_SECRET: test-only-local-file-signing-secret
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const cp=require('node:child_process');
          const connectDatabase=require('./src/config/database');
          const outbox=require('./src/workflows/outbox');
          const root=path.resolve('uploaded-files');
          const dir=path.join(root,'assets','files');
          const exec=(args) => cp.execFileSync(process.execPath,args,{encoding:'utf8',env:process.env});
          (async()=>{
            await connectDatabase();
            try {
              fs.mkdirSync(dir,{recursive:true});
              const old=path.join(dir,'old-orphan.txt');
              const fresh=path.join(dir,'fresh-orphan.txt');
              fs.writeFileSync(old,'old');
              fs.writeFileSync(fresh,'fresh');
              const oldDate=new Date(Date.now()-49*3600000);
              fs.utimesSync(old,oldDate,oldDate);
              let report=JSON.parse(exec(['scripts/storage-reconcile.js']));
              assert.equal(report.mode,'dry-run');
              assert.ok(report.keys.includes('assets/files/old-orphan.txt'));
              assert.ok(!report.keys.includes('assets/files/fresh-orphan.txt'));
              assert.ok(fs.existsSync(old),'dry run must never delete');
              assert.throws(()=>exec(['scripts/storage-reconcile.js','--execute','--older-than-hours','1']));
              report=JSON.parse(exec(['scripts/storage-reconcile.js','--execute']));
              assert.equal(report.removed,1);
              assert.equal(fs.existsSync(old),false);
              assert.ok(fs.existsSync(fresh));
              // Force a recoverable physical deletion failure, then restart worker.
              const recoverable=path.join(dir,'recoverable');
              fs.mkdirSync(recoverable,{recursive:true});
              fs.writeFileSync(path.join(recoverable,'keep.txt'),'blocked');
              const intent=await outbox.enqueueJob('__j2e_storage_cleanup__',{
                values:[{key:'assets/files/recoverable',provider:'local'}]
              },{config:{queue:'storage',maxAttempts:4,backoffMs:1}});
              assert.equal((await outbox.storageStats()).pending,1);
              exec(['src/workflows/worker.js','--once']);
              assert.equal((await outbox.storageStats()).pending,1);
              fs.rmSync(recoverable,{recursive:true});
              fs.writeFileSync(recoverable,'restored');
              await new Promise(resolve=>setTimeout(resolve,80));
              exec(['src/workflows/worker.js','--once']);
              const row=await outbox.Outbox.findById(intent._id);
              assert.equal(row.status,'done');
              assert.equal(fs.existsSync(recoverable),false);
              assert.equal((await outbox.storageStats()).pending,0);
            } finally {await connectDatabase.disconnect();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Race orphan reconciliation with a new MongoDB reference and file replacement
        working-directory: .tmp/fastify-local-files
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify_local
          FILE_SIGNING_SECRET: test-only-local-file-signing-secret
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const db=require('./src/config/database');
          const Asset=require('./src/models/Asset');
          const audit=require('./scripts/storage-reconcile');
          const dir=path.join('uploaded-files','assets','files');
          const oldDate=new Date(Date.now()-49*3600000);
          function oldFile(name){
            const key='assets/files/'+name;
            const file=path.join(dir,name);
            fs.mkdirSync(dir,{recursive:true});
            fs.writeFileSync(file,'previous');
            fs.utimesSync(file,oldDate,oldDate);
            return {key,file};
          }
          (async()=>{
            await db();
            try {
              const linked=oldFile('late-writer.txt');
              const replaced=oldFile('replaced-object.txt');
              const orphan=oldFile('two-workers.txt');
              let added=false,modified=false;
              const result=await audit.reconcile(audit.args(['--execute']),{
                async beforeCandidate(item){
                  if(item.key===linked.key){
                    await Asset.create({name:'Concurrent writer',file:{key:linked.key,provider:'local',originalName:'late-writer.txt',mimeType:'text/plain',size:8}});
                    added=true;
                  }
                  if(item.key===replaced.key) {
                    fs.writeFileSync(replaced.file,'replacement');
                    modified=true;
                  }
                }
              });
              assert.ok(added && modified);
              assert.ok(result.skippedReferenced>=1,'newly referenced object must not be deleted');
              assert.ok(result.skippedModified>=1,'overwritten old object must not be deleted');
              assert.ok(fs.existsSync(linked.file));
              assert.ok(fs.existsSync(replaced.file));
              assert.equal(fs.existsSync(orphan.file),false,'unreferenced old object should be deleted');
              assert.equal((await Asset.countDocuments({'file.key':linked.key})),1);
              const pair=oldFile('multi-reconciler.txt');
              const runs=await Promise.allSettled([audit.reconcile(audit.args(['--execute'])),audit.reconcile(audit.args(['--execute']))]);
              assert.equal(runs.filter(x=>x.status==='fulfilled').length,1,'exactly one lease holder');
              assert.equal(runs.filter(x=>x.status==='rejected').length,1,'competing replica must fail closed');
              assert.match(String(runs.find(x=>x.status==='rejected').reason),/distributed lease/);
              assert.equal(fs.existsSync(pair.file),false,'lease holder performs deletion once');
            } finally {await db.disconnect();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Standalone MongoDB enqueue outage recovers through age-gated reconciliation
        working-directory: .tmp/fastify-local-files
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify_local
          FILE_SIGNING_SECRET: test-only-local-file-signing-secret
        run: |
          timeout 90s node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const db=require('./src/config/database');
          const storage=require('./src/config/storage');
          const audit=require('./scripts/storage-reconcile');
          const app=require('./src/app');
          const Asset=require('./src/models/Asset');
          (async()=>{
            await db();
            try {
            console.log('chaos: database connected');
            const form=new FormData();
            form.set('name','Unavailable outbox store');
            form.set('file',new Blob(['reconcile after outage'],{type:'text/plain'}),'outage.txt');
            const created=await fetch('http://127.0.0.1:3494/api/assets',{method:'POST',body:form});
            assert.equal(created.status,201);
            console.log('chaos: upload created');
            const item=await created.json();
            const file=path.join('uploaded-files',item.file.key);
            assert.ok(fs.existsSync(file));
            const real=storage.cleanupAfterCommit;
            try {
              storage.cleanupAfterCommit=async()=>{throw new Error('simulated unavailable enqueue database');};
              const failed=await app.inject({method:'DELETE',url:'/api/assets/'+item._id});
              assert.equal(failed.statusCode,500);
            } finally {storage.cleanupAfterCommit=real;}
            console.log('chaos: simulated outage injection completed');
            assert.equal(await Asset.findById(item._id),null,'standalone operation committed before failed outbox enqueue');
            assert.ok(fs.existsSync(file),'no unsafe rollback/physical deletion after enqueue outage');
            const age=new Date(Date.now()-49*3600000);
            fs.utimesSync(file,age,age);
            console.log('chaos: starting recovery reconciliation');
            const report=await audit.reconcile(audit.args(['--execute']));
            assert.ok(report.removed>=1,'reconciler must reclaim orphan after safe minimum age');
            assert.equal(fs.existsSync(file),false);
            } finally {
              await app.close();
              await db.disconnect();
            }
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: SIGKILL local storage worker between deletion and acknowledgement
        working-directory: .tmp/fastify-local-files
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_fastify_local
          FILE_SIGNING_SECRET: test-only-local-file-signing-secret
        run: |
          cp ../../scripts/fixtures/storage-worker-kill.js ./storage-worker-kill.js
          node storage-worker-kill.js local
      - name: Print application logs on failure
        if: failure()
        run: cat .tmp/fastify-local-files/server.log || true


  generated-fastify-mongo-transaction-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start single-node MongoDB replica set
        run: |
          docker run -d --name mongo-transaction --network host mongo:7 --replSet rs0 --bind_ip_all
          for attempt in {1..50}; do
            if docker exec mongo-transaction mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 1
          done
          docker exec mongo-transaction mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..40}; do
            if docker exec mongo-transaction mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then break; fi
            sleep 1
          done
      - name: Generate native MongoDB transactional CRUD
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const spec = {
            specVersion:'1.0',
            generation:{outputDir:'.tmp/fastify-mongo-transaction'},
            app:{name:'fastify-mongo-transaction',framework:'fastify',port:3493,host:'127.0.0.1'},
            database:{type:'mongodb',uriEnv:'MONGODB_URI'},
            auth:{enabled:true,strategies:['apiKey'],apiKey:{header:'x-api-key',keys:[{env:'AUDIT_KEY',userId:'auditor',roles:['admin']}]}},
            storage:{enabled:true,provider:'local',signedUrls:{enabled:false},local:{directory:'uploads'}},
            entities:{
              Owner:{fields:{name:{type:'string',required:true},age:{type:'number'},portrait:{type:'file',upload:{mimeTypes:['image/png'],maxBytes:2048}}},softDelete:{enabled:true},audit:{enabled:true},hooks:{module:'src/hooks/owner.js',before:{create:'preCreate'},after:{create:'postCreate'}},
                operations:{create:{transaction:true,auth:{required:true,strategies:['apiKey'],roles:['admin']}},update:{transaction:true,auth:{required:true,strategies:['apiKey'],roles:['admin']}},delete:{transaction:true}}},
              Dependent:{fields:{title:{type:'string'},owner:{type:'reference',ref:'Owner',onDelete:'restrict'}},operations:{create:{transaction:true,populate:['owner']},update:{transaction:true,populate:['owner']}}},
              Link:{fields:{owner:{type:'reference',ref:'Owner',onDelete:'nullify'}}},
              Cascade:{fields:{owner:{type:'reference',ref:'Owner',onDelete:'cascade'},attachment:{type:'file',upload:{mimeTypes:['image/png'],maxBytes:2048}}}},
              CascadeChild:{route:'cascade-children',fields:{cascade:{type:'reference',ref:'Cascade',onDelete:'cascade'}}},
              Watchlist:{fields:{owners:{type:'reference',ref:'Owner',many:true,onDelete:'nullify'}}}
            }
          };
          fs.writeFileSync('/tmp/fastify-mongo-transaction.json',JSON.stringify(spec));
          NODE
          node bin/json-to-express.js generate /tmp/fastify-mongo-transaction.json
          mkdir -p .tmp/fastify-mongo-transaction/src/hooks
          cat > .tmp/fastify-mongo-transaction/src/hooks/owner.js <<'HOOK'
          module.exports = {
            preCreate({req}) {req.body.name = 'hooked-' + req.body.name;},
            postCreate({result}) {if (!result.name.startsWith('hooked-')) throw new Error('Hook did not execute');}
          };
          HOOK
      - name: Install generated MongoDB app
        working-directory: .tmp/fastify-mongo-transaction
        run: npm install --no-audit --no-fund
      - name: Exercise transactions, soft delete and foreign-key restrictions
        working-directory: .tmp/fastify-mongo-transaction
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_native_tx?replicaSet=rs0
          PORT: 3493
          HOST: 127.0.0.1
          AUDIT_KEY: test-audit-key
        run: |
          npm start > server.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3493/health >/dev/null; then break; fi
            sleep 1
          done
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const root='http://127.0.0.1:3493/api';
          const send=(url,method,body)=>fetch(root+url,{method,headers:{'content-type':'application/json','x-api-key':'test-audit-key'},body:JSON.stringify(body)});
          (async()=>{
            const ownerResponse=await send('/owners','POST',{name:'Target'});
            assert.equal(ownerResponse.status,201);
            const owner=await ownerResponse.json();
            assert.ok(owner._id);
            assert.equal(owner.name,'hooked-Target');
            assert.equal(owner.createdBy,'auditor');
            const updated=await send('/owners/'+owner._id,'PATCH',{name:'New name'});
            assert.equal(updated.status,200);
            assert.equal((await updated.json()).updatedBy,'auditor');
            const fs=require('node:fs');
            const path=require('node:path');
            const storageFiles=()=>fs.existsSync('uploads') ? fs.readdirSync('uploads',{recursive:true}).filter(name=>String(name).endsWith('.png')).length : 0;
            const filesBefore=storageFiles();
            const invalidUpload=new FormData();
            invalidUpload.set('portrait',new Blob([new Uint8Array([137,80,78,71])],{type:'image/png'}),'invalid.png');
            invalidUpload.set('age','invalid-number');
            const rejected=await fetch(root+'/owners',{method:'POST',headers:{'x-api-key':'test-audit-key'},body:invalidUpload});
            assert.equal(rejected.status,400);
            assert.equal(storageFiles(),filesBefore,'rejected multipart must compensate staged storage');
            const acceptedUpload=new FormData();
            acceptedUpload.set('name','Uploaded');
            acceptedUpload.set('portrait',new Blob([new Uint8Array([137,80,78,71])],{type:'image/png'}),'valid.png');
            const storedResponse=await fetch(root+'/owners',{method:'POST',headers:{'x-api-key':'test-audit-key'},body:acceptedUpload});
            assert.equal(storedResponse.status,201);
            const storedOwner=await storedResponse.json();
            assert.ok(storedOwner.portrait.key);
            assert.ok(fs.existsSync(path.join('uploads',storedOwner.portrait.key)),'transactional commit retains stored file');
            // A failing enqueue must abort both the MongoDB mutation and the outbox write.
            const connectDB=require('./src/config/database');
            const storage=require('./src/config/storage');
            const outbox=require('./src/workflows/outbox');
            const nativeApp=require('./src/app');
            await connectDB();
            const enqueueOriginal=storage.enqueueCleanupIntent;
            const prior=(await (require('./src/models/Owner')).findById(storedOwner._id).lean());
            const beforePending=await outbox.storageStats();
            try {
              storage.enqueueCleanupIntent=async () => {throw new Error('injected enqueue failure');};
              const failed=await nativeApp.inject({
                method:'PATCH',url:'/api/owners/'+storedOwner._id,
                headers:{'x-api-key':'test-audit-key','content-type':'application/json'},
                payload:JSON.stringify({portrait:null})
              });
              assert.equal(failed.statusCode,500,'cleanup enqueue failure aborts the transaction');
            } finally {storage.enqueueCleanupIntent=enqueueOriginal;}
            const persisted=await (require('./src/models/Owner')).findById(storedOwner._id).lean();
            assert.equal(persisted.portrait.key,prior.portrait.key,'MongoDB file reference rolled back');
            assert.equal((await outbox.storageStats()).pending,beforePending.pending,'no phantom cleanup intent');
            assert.equal(fs.existsSync(path.join('uploads',prior.portrait.key)),true,'rollback preserves file');

            assert.equal((await fetch(root+'/owners/'+storedOwner._id,{method:'DELETE',headers:{'x-api-key':'test-audit-key'}})).status,204);
            assert.equal(fs.existsSync(path.join('uploads',storedOwner.portrait.key)),false,'deleted entity cleans referenced storage');
            const linkResponse=await send('/links','POST',{owner:owner._id});
            assert.equal(linkResponse.status,201);
            const link=await linkResponse.json();
            const cascadeForm=new FormData();
            cascadeForm.set('owner',owner._id);
            cascadeForm.set('attachment',new Blob([new Uint8Array([137,80,78,71])],{type:'image/png'}),'nested.png');
            const cascadeResponse=await fetch(root+'/cascades',{method:'POST',headers:{'x-api-key':'test-audit-key'},body:cascadeForm});
            assert.equal(cascadeResponse.status,201);
            const cascade=await cascadeResponse.json();
            const cascadePath=path.join('uploads',cascade.attachment.key);
            assert.ok(fs.existsSync(cascadePath));
            // Even with transaction:false, a Mongo replica set must use a session.
            const beforeCascade=await (require('./src/models/Cascade')).findById(cascade._id).lean();
            const originalAtomicEnqueue=storage.enqueueCleanupIntent;
            try {
              storage.enqueueCleanupIntent=async()=>{throw new Error('injected cascade update enqueue error');};
              const aborted=await nativeApp.inject({
                method:'PATCH',url:'/api/cascades/'+cascade._id,
                headers:{'x-api-key':'test-audit-key','content-type':'application/json'},
                payload:JSON.stringify({attachment:null})
              });
              assert.equal(aborted.statusCode,500);
            } finally {storage.enqueueCleanupIntent=originalAtomicEnqueue;}
            const cascadeAfter=await (require('./src/models/Cascade')).findById(cascade._id).lean();
            assert.equal(cascadeAfter.attachment.key,beforeCascade.attachment.key,'auto-session rolls back non-transaction flag');
            assert.ok(fs.existsSync(cascadePath));
            const nestedResponse=await send('/cascade-children','POST',{cascade:cascade._id});
            assert.equal(nestedResponse.status,201);
            const nested=await nestedResponse.json();
            const watchlistResponse=await send('/watchlists','POST',{owners:[owner._id]});
            assert.equal(watchlistResponse.status,201);
            const watchlist=await watchlistResponse.json();
            const dependentResponse=await send('/dependents','POST',{title:'Dependent',owner:owner._id});
            assert.equal(dependentResponse.status,201);
            const populatedDependent=await dependentResponse.json();
            assert.equal(populatedDependent.owner._id,owner._id);
            const populatedUpdate=await send('/dependents/'+populatedDependent._id,'PATCH',{title:'Updated'});
            assert.equal(populatedUpdate.status,200);
            assert.equal((await populatedUpdate.json()).owner._id,owner._id);
            const restricted=await fetch(root+'/owners/'+owner._id,{method:'DELETE',headers:{'x-api-key':'test-audit-key'}});
            assert.equal(restricted.status,409);
            assert.equal((await fetch(root+'/owners/'+owner._id,{headers:{'x-api-key':'test-audit-key'}})).status,200);
            const dependent=populatedDependent;
            assert.equal((await fetch(root+'/dependents/'+dependent._id,{method:'DELETE',headers:{'x-api-key':'test-audit-key'}})).status,204);
            const deleted=await fetch(root+'/owners/'+owner._id,{method:'DELETE',headers:{'x-api-key':'test-audit-key'}});
            assert.equal(deleted.status,204);
            assert.equal((await fetch(root+'/owners/'+owner._id,{headers:{'x-api-key':'test-audit-key'}})).status,404);
            const linked=await fetch(root+'/links/'+link._id,{headers:{'x-api-key':'test-audit-key'}});
            assert.equal(linked.status,200);
            assert.equal((await linked.json()).owner,null);
            assert.equal((await fetch(root+'/cascades/'+cascade._id,{headers:{'x-api-key':'test-audit-key'}})).status,404);
            assert.equal((await fetch(root+'/cascade-children/'+nested._id,{headers:{'x-api-key':'test-audit-key'}})).status,404);
            assert.equal(fs.existsSync(cascadePath),false,'cascade deletion must clean child file inside root transaction');
            const afterWatchlist=await fetch(root+'/watchlists/'+watchlist._id,{headers:{'x-api-key':'test-audit-key'}});
            assert.equal(afterWatchlist.status,200);
            assert.deepEqual((await afterWatchlist.json()).owners,[]);
            await nativeApp.close();
            await connectDB.disconnect();
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: SIGKILL Mongo process at commit boundary and restart cleanup worker
        working-directory: .tmp/fastify-mongo-transaction
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_native_tx?replicaSet=rs0
          AUDIT_KEY: test-audit-key
          PORT: 3493
          HOST: 127.0.0.1
        run: |
          cp ../../scripts/fixtures/storage-chaos-mongo-kill.js ./storage-chaos-mongo-kill.js
          node storage-chaos-mongo-kill.js
      - name: Mongo replica-set cross-process storage lease SIGKILL recovery
        working-directory: .tmp/fastify-mongo-transaction
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/j2e_native_tx?replicaSet=rs0
        run: |
          cp ../../scripts/fixtures/storage-lease-kill.js ./storage-lease-kill.js
          node storage-lease-kill.js
      - name: Print logs on failure
        if: failure()
        run: |
          cat .tmp/fastify-mongo-transaction/server.log || true
          docker logs mongo-transaction || true
